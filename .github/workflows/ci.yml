name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore dependencies
        run: dotnet restore SketchMind.slnx

      - name: Build
        run: dotnet build SketchMind.slnx --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test SketchMind.slnx --configuration Release --no-build

